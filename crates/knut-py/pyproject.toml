[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "knut"
description = "Fast access to OpenStreetMap history in knut databases, and the knut query language"
keywords = ["OpenStreetMap", "query language"]
classifiers = [
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Database",
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[project.urls]
Repository = "https://github.com/mocnik-science/knut"

[project.optional-dependencies]
arrow = ["pyarrow>=14"]

[tool.maturin]
python-source = "python"
module-name = "knut._knut"
features = ["pyo3/extension-module"]
strip = true
