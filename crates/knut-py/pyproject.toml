[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "knut"
description = "Read knut files (compact OSM history with space-time index)"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow>=14"]

[tool.maturin]
python-source = "python"
module-name = "knut._knut"
features = ["pyo3/extension-module"]
