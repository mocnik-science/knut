[package]
name = "knut"
description = "Reader and query engine for knut databases: compact OpenStreetMap history, memory-mapped, with a space-time index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["science::geo", "database-implementations"]

[features]
default = ["arrow"]
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-buffer"]

[dependencies]
knut-format.workspace = true
zstd.workspace = true
xxhash-rust.workspace = true
rayon.workspace = true
memmap2.workspace = true
thiserror.workspace = true
rustc-hash.workspace = true
lru = "0.18"
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }

[dev-dependencies]
knut-builder.workspace = true
criterion.workspace = true
zstd.workspace = true

[[bench]]
name = "queries"
harness = false
