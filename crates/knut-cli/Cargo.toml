[package]
name = "knut-cli"
description = "Command line tool for knut: converts OpenStreetMap history and runs knut scripts, in the terminal or in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["science::geo", "command-line-utilities"]

[[bin]]
name = "knut"
path = "src/main.rs"
# the library crate `knut` has the same name; its docs take precedence
doc = false

[dependencies]
knut-format.workspace = true
knut-builder.workspace = true
knut.workspace = true
knut-exec.workspace = true
knut-web.workspace = true
clap.workspace = true
serde_json.workspace = true
rayon.workspace = true
xxhash-rust.workspace = true
zstd.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-buffer.workspace = true
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }

[dev-dependencies]
