[package]
name = "knut-cli"
description = "knut command line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "knut"
path = "src/main.rs"
# the library crate `knut` has the same name; its docs take precedence
doc = false

[dependencies]
knut-format.workspace = true
knut-builder.workspace = true
knut.workspace = true
clap.workspace = true
serde_json.workspace = true
rayon.workspace = true
xxhash-rust.workspace = true
zstd.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-buffer.workspace = true
parquet = { version = "45", default-features = false, features = ["arrow", "zstd"] }

[dev-dependencies]
