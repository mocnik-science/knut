[workspace]
resolver = "2"
members = [
    "crates/knut-format",
    "crates/knut-builder",
    "crates/knut",
    "crates/knut-lang",
    "crates/knut-plan",
    "crates/knut-exec",
    "crates/knut-web",
    "crates/knut-cli",
    "crates/knut-py",
    "crates/knut-llm",
    "crates/knut-train",
]
# knut-py is built with maturin (see crates/knut-py/pyproject.toml).
default-members = [
    "crates/knut-format",
    "crates/knut-builder",
    "crates/knut",
    "crates/knut-lang",
    "crates/knut-plan",
    "crates/knut-exec",
    "crates/knut-web",
    "crates/knut-cli",
]

[workspace.package]
version = "2026.10.4"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/mocnik-science/knut"
readme = "README.md"
keywords = ["openstreetmap", "query-language"]

[workspace.dependencies]
knut-format = { path = "crates/knut-format", version = "2026.10.4" }
knut-builder = { path = "crates/knut-builder", version = "2026.10.4" }
knut = { path = "crates/knut", version = "2026.10.4" }
knut-lang = { path = "crates/knut-lang", version = "2026.10.4" }
knut-plan = { path = "crates/knut-plan", version = "2026.10.4" }
knut-exec = { path = "crates/knut-exec", version = "2026.10.4" }
knut-web = { path = "crates/knut-web", version = "2026.10.4" }
thiserror = "2"
rustc-hash = "2"
anyhow = "1"
zstd = "0.14"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", features = ["alloc"] }
rayon = "1.10"
memmap2 = "0.9"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
libc = "0.2"
proptest = "1"
criterion = "0.8"
arrow-array = { version = "60", features = ["ffi"] }
arrow-schema = "60"
arrow-buffer = "60"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.bench]
debug = 1
